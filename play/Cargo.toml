[package]
name = "play"
version = "0.1.0"
edition = "2021"
description = "WebSocket + browser front end for playing against the Anna engine"

[[bin]]
name = "play"
path = "src/main.rs"

[dependencies]
engine = { path = "../engine" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "net", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
rand = "0.9"

[dev-dependencies]
tokio-tungstenite = "0.26"
